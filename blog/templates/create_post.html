<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Blog Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .django-form-wrapper input, 
        .django-form-wrapper textarea {
            width: 100%;
            padding: 0.625rem 0.875rem;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            margin-top: 0.375rem;
            outline: none;
            transition: all 0.2s;
        }
        .django-form-wrapper input:focus, 
        .django-form-wrapper textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .django-form-wrapper p {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            color: #334155;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .django-form-wrapper p fill {
            font-weight: normal;
            color: #64748b;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center py-12 px-4">

    <div class="w-full max-w-xl">
        <a href="{% url 'post_list' %}" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-slate-800 mb-6 group transition">
            <svg class="w-4 h-4 mr-1.5 transform group-hover:-translate-x-1 transition duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Blog Feed
        </a>

        <div class="bg-white border border-slate-200 shadow-xl rounded-2xl p-6 sm:p-10">
            <div class="mb-8">
                <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Add a New Blog Post</h2>
                <p class="text-slate-500 mt-1.5 text-sm">Fill out the information details below to instantly publish your media asset update to the cloud.</p>
            </div>
            
            <form method="post" enctype="multipart/form-data" class="django-form-wrapper space-y-2">
                {% csrf_token %}
                
                {{ form.as_p }}
                
                <div class="pt-4">
                    <button type="submit" class="w-full flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-150 shadow-md hover:shadow-lg active:scale-[0.99]">
                        Publish Post
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
